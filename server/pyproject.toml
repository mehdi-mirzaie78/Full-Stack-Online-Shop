[project]
name = "server"
version = "0.1.0"
description = "Full-Stack Online Shop DRF Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "django>=5.1,<5.2",
    "djangorestframework>=3.15,<3.16",
    "django-cors-headers>=4.4",
    "drf-spectacular>=0.27",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.3.0",
    "redis>=5.0",
    "celery>=5.4",
    "django-environ>=0.11",
    "boto3>=1.34",
    "django-storages>=1.14",
    "pyjwt>=2.8",
    "cryptography>=42.0",
    "opentelemetry-api>=1.38,<2",
    "opentelemetry-sdk>=1.38,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.38,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "ruff>=0.6.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*/migrations/*",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"
markers = ["integration: exercises real PostgreSQL or Redis"]
