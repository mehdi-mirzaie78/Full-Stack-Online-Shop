groups:
  - name: local-observability
    rules:
      - alert: TelemetryTargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Local telemetry target unavailable
      - alert: ApplicationErrorRatio
        expr: sum by (service_name) (rate(traces_span_metrics_calls_total{span_kind="SPAN_KIND_SERVER",status_code="STATUS_CODE_ERROR"}[5m])) / sum by (service_name) (rate(traces_span_metrics_calls_total{span_kind="SPAN_KIND_SERVER"}[5m])) > 0.05 and on (service_name) sum by (service_name) (increase(traces_span_metrics_calls_total{span_kind="SPAN_KIND_SERVER"}[5m])) > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Observed server error ratio above five percent
      - alert: ApplicationLatency
        expr: histogram_quantile(0.95, sum by (le,service_name) (rate(traces_span_metrics_duration_milliseconds_bucket{span_kind="SPAN_KIND_SERVER"}[5m]))) > 1000 and on (service_name) sum by (service_name) (increase(traces_span_metrics_calls_total{span_kind="SPAN_KIND_SERVER"}[5m])) > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Observed server p95 above one second
