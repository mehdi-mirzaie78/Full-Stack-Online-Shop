# Read-only Engine API. Alloy requires inspect for TTY/log framing.
# Listing and inspect expose host-wide metadata including env; compromise remains serious.
# No exec, archive, export, images, volumes, events or write routes.
global
  log stdout format raw local0 warning
  maxconn 64
defaults
  mode http
  timeout connect 5s
  timeout client 1h
  timeout server 1h
frontend docker
  bind :2375
  acl read method GET HEAD
  acl allowed path_reg ^(/v[0-9.]+)?/(_ping|version|containers/json|containers/[a-f0-9]+/(logs|json)|networks)$
  http-request deny deny_status 403 unless read allowed
  default_backend engine
backend engine
  server socket /var/run/docker.sock
